services:
  database:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: cvsight-postgres:17-pgvector-0.8.6
    environment:
      POSTGRES_DB: shelfsight
      POSTGRES_USER: shelfsight
      POSTGRES_PASSWORD: ${SHELFSIGHT_DB_PASSWORD:?Set SHELFSIGHT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${SHELFSIGHT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfsight -d shelfsight"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - shelfsight_postgres_data:/var/lib/postgresql/data

volumes:
  shelfsight_postgres_data:
