[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsight"
version = "0.3.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.162.0,<1",
    "google-crc32c>=1.7,<2",
    "pgvector>=0.5.1,<1",
    "pillow==13.0.0",
    "psycopg[binary]>=3.2,<4",
    "python-multipart==0.0.33",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.1.6,<3",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pip-audit==2.10.1",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.13"
strict = true
files = ["shelfsight_api", "benchmark_tool", "tests"]

# Only the GPU runtimes install these, so they are absent where the checks run.
[[tool.mypy.overrides]]
module = ["cv2", "numpy", "sam3", "sam3.*", "torch"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["benchmark_tool*", "shelfsight_api*"]
