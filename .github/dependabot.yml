version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /docker/api
      - /docker/postgres
      - /docker/web
    schedule:
      interval: weekly
    # CI, the tooling and the images share one Python and one Node version, so moving
    # to a new one is a deliberate change made everywhere at once, not an image bump.
    # Dependabot reads Python 3.13 to 3.15 as a minor update.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
